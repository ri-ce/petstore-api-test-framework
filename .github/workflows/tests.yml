name: Automation test suite

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PETSTORE_BASE_URL: https://petstore3.swagger.io/api/v3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium browser
        run: python -m playwright install --with-deps chromium

      - name: Run Petstore API tests
        run: |
          python -m pytest \
            tests \
            --html=reports/petstore-report.html \
            --self-contained-html

      - name: Run SauceDemo UI tests
        run: |
          python -m pytest \
            ui_tests \
            --html=reports/saucedemo-ui-report.html \
            --self-contained-html

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automation-test-reports
          path: |
            reports/petstore-report.html
            reports/saucedemo-ui-report.html
            reports/screenshots/
